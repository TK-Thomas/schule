function vGr(){const by={};S.grades.forEach(x=>(by[x.fach]=by[x.fach]||[]).push(x));
const f=v=>v.toFixed(2).replace('.',','),n=x=>String(x).replace('.',',');
return `<div class="flex items-center justify-between mb-4"><span class="font-semibold">Noten</span><button data-a="ngr" class="btn-w">＋ Note</button></div>`+(Object.keys(by).length?Object.keys(by).sort().map(k=>{const l=by[k].sort((a,b)=>b.datum.localeCompare(a.datum)),sw=l.reduce((s,x)=>s+x.gew,0),avg=l.reduce((s,x)=>s+x.wert*x.gew,0)/sw;
return `<div class="card mb-3"><div class="flex justify-between px-4 py-3"><b>${esc(k)}</b><span class="text-sm text-[#8A8A9E]">Ø <b class="text-white">${f(avg)}</b></span></div>${l.map(x=>`<button data-a="egr" data-i="${x.id}" class="w-full flex items-center gap-3 px-4 py-2 border-t border-[#2A2A35] text-sm text-left"><b class="w-8">${n(x.wert)}</b><span class="flex-1 text-[#8A8A9E]">${esc(x.art)} • ${x.gew}x${x.notiz?' • '+esc(x.notiz):''}</span><span class="text-xs text-[#8A8A9E]">${fd(x.datum)}</span></button>`).join('')}</div>`}).join(''):'<div class="card py-12 text-center text-sm text-[#8A8A9E]">Noch keine Noten</div>')}
function vEv(){const{y,m}=cal,td=iso(new Date()),first=new Date(y,m,1),last=new Date(y,m+1,0),s=new Date(first);s.setDate(1-((first.getDay()+6)%7));const rows=[];
for(let d=new Date(s);d<=last;d.setDate(d.getDate()+7)){const c=[];for(let k=0;k<5;k++){const x=new Date(d);x.setDate(d.getDate()+k);c.push(x)}rows.push(c)}
const cell=x=>{const s=iso(x),dots=S.events.filter(e=>e.date==s).map(e=>TC[e.typ]||TC.sonstiges);if(inF(s))dots.push('bg-blue-500');if(S.homeworks.some(h=>h.due==s&&!h.done))dots.push('bg-zinc-500');
return `<button data-a="day" data-i="${s}" class="h-16 p-1.5 rounded-xl border flex flex-col justify-between items-end ${selD==s?'border-white':'border-[#2A2A35]'} ${x.getMonth()!=m?'opacity-30':''} ${s==td?'bg-[#151B33]':'bg-[#1C1C22]'}"><span class="text-xs">${x.getDate()}</span><span class="flex gap-1 flex-wrap justify-end">${dots.slice(0,4).map(c=>`<i class="w-1.5 h-1.5 rounded-full ${c}"></i>`).join('')}</span></button>`};
const ev=S.events.filter(e=>e.date==selD),hs=S.homeworks.filter(h=>h.due==selD),fe=S.ferien.filter(f=>f.von<=selD&&selD<=(f.bis||f.von));
return `<div class="flex items-center justify-between mb-4"><div class="flex items-center gap-3"><button data-a="cm" data-i="-1" class="btn">‹</button><span class="font-semibold w-36 text-center">${MN[m]} ${y}</span><button data-a="cm" data-i="1" class="btn">›</button></div><button data-a="nev" data-i="${selD}" class="btn-w">＋ Termin</button></div>
<div class="grid grid-cols-5 gap-1.5 text-center text-xs text-[#8A8A9E] mb-1.5">${DAYS.map(d=>`<div>${d}</div>`).join('')}</div><div class="grid grid-cols-5 gap-1.5 mb-5">${rows.flat().map(cell).join('')}</div>
<div class="card p-4"><div class="lab">${DN[pd(selD).getDay()]}, ${DD(selD)}</div>${fe.map(f=>`<div class="text-sm py-1 text-blue-400">${esc(f.titel)}</div>`).join('')}${ev.map(e=>`<button data-a="eev" data-i="${e.id}" class="w-full text-left text-sm py-1.5 flex items-center gap-2"><i class="w-2 h-2 rounded-full ${TC[e.typ]}"></i><b>${esc(e.titel)}</b><span class="text-[#8A8A9E]">${cap(e.typ)}${e.fach?' • '+esc(e.fach):''}</span></button>`).join('')}${hs.map(h=>`<div class="text-sm py-1.5 text-[#8A8A9E]">HA fällig: ${esc(h.fach)} – ${esc(h.titel)}</div>`).join('')}${ev.length+hs.length+fe.length?'':'<div class="text-sm text-[#8A8A9E]">Keine Termine</div>'}</div>`}
function vSt(){const ti=()=>{let h='';for(let i=1;i<=9;i++){const t=S.times[i]||{};h+=`<div class="flex items-center gap-2 mb-2"><b class="w-6 text-sm">${i}.</b><input type="time" class="in" data-c="tm|${i}|start" value="${t.start||''}"><input type="time" class="in" data-c="tm|${i}|end" value="${t.end||''}"></div>`}return h};
return `<div class="card p-4 mb-4"><div class="lab">Zeiten (7. = Mittagspause)</div>${ti()}</div>
<div class="card p-4 mb-4"><div class="lab">Fächer-Infos</div>${subj().filter(f=>Object.values(S.plan).some(d=>Object.values(d).some(x=>x.fach==f))||S.subjectInfos[f]).map(f=>`<div class="mb-3"><b class="text-sm">${esc(f)}</b><div class="grid grid-cols-2 gap-2 mt-1"><input class="in" placeholder="Lehrer:in" data-c="si|${esc(f)}|lehrer" value="${esc(S.subjectInfos[f]?.lehrer)}"><input class="in" placeholder="Hinweis (Packliste)" data-c="si|${esc(f)}|hinweis" value="${esc(S.subjectInfos[f]?.hinweis)}"></div></div>`).join('')}</div>
<div class="card p-4 mb-4"><div class="lab">Ferien &amp; freie Tage</div>${S.ferien.map((f,i)=>`<div class="mb-3 grid grid-cols-[1fr_auto] gap-2"><input class="in" placeholder="Titel" data-c="fe|${i}|titel" value="${esc(f.titel)}"><button data-a="fx" data-i="${i}" class="btn text-red-400">✕</button><div class="grid grid-cols-2 gap-2 col-span-2"><input type="date" class="in" data-c="fe|${i}|von" value="${f.von}"><input type="date" class="in" data-c="fe|${i}|bis" value="${f.bis}"></div></div>`).join('')}<button data-a="fa" class="btn">＋ Ferien</button></div>
<div class="card p-4 mb-4"><div class="lab">Backup</div><button data-a="pdf" class="btn-w">Wochenübersicht als PDF</button></div>
<div class="card p-4 mb-4"><div class="lab">Benachrichtigungen (nur dieses Gerät)</div><p class="text-xs text-[#8A8A9E] mb-3">Abends Packliste, mittags Hausaufgaben und Termine. Am besten nur auf dem Handy aktivieren.</p><div class="flex gap-2"><button data-a="pn" class="btn-w">Aktivieren</button><button data-a="pf" class="btn">Ausschalten</button></div></div>
<div class="card p-4 mb-4"><div class="lab">Konto / Sync</div>${user?`<p class="text-sm mb-3">Eingeloggt als ${esc(user.email)}</p><button data-a="lo" class="btn">Logout</button>`:`<input id="em" type="email" placeholder="E-Mail" class="in mb-2"><input id="pw" type="password" placeholder="Passwort" class="in mb-3"><button data-a="li" class="btn-w">Login</button>`}</div><p class="text-xs text-zinc-600 text-center">Schulplaner v${VER}</p>`}
function render(){const n=new Date();$('#app').innerHTML=`<div class="flex items-center justify-between gap-3 mb-5"><div class="flex gap-1 p-1 rounded-full bg-[#14141A] border border-[#2A2A35] overflow-x-auto">${[['hw','Hausaufgaben'],['tt','Stundenplan'],['gr','Noten'],['ev','Termine']].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="px-4 py-2 rounded-full text-[13px] whitespace-nowrap ${tab==k?'bg-white text-black font-semibold':'text-[#8A8A9E]'}">${l}</button>`).join('')}</div><div class="flex items-center gap-3 shrink-0"><span class="text-[13px] text-[#8A8A9E] hidden sm:inline">${DN[n.getDay()]}, ${DD(iso(n))}</span><button data-a="tab" data-i="st" class="relative w-8 h-8 rounded-full bg-white text-black text-sm font-bold">T<span class="absolute -right-0.5 -bottom-0.5 w-2.5 h-2.5 rounded-full border-2 border-[#0A0A0F] ${user?'bg-green-500':'bg-zinc-500'}"></span></button><button data-a="tab" data-i="st" class="w-8 h-8 rounded-full ${tab=='st'?'bg-white text-black':'bg-[#1C1C22] text-[#8A8A9E]'} border border-[#2A2A35]">⚙</button></div></div>`+({hw:vHw,tt:vTt,gr:vGr,ev:vEv,st:vSt}[tab])()}
// ---- Events
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a=='tab'){tab=i;render()}else if(a=='nhw')hwDlg();else if(a=='ehw')hwDlg(S.homeworks.find(h=>h.id==i));
else if(a=='tg'){const h=S.homeworks.find(x=>x.id==i);h.done=!h.done;h.doneAt=h.done?iso(new Date()):'';commit()}
else if(a=='dn'){doneOpen=!doneOpen;render()}else if(a=='wk'){wk=i=='1';render()}else if(a=='wn'){wkS=add(wkS,+i);render()}
else if(a=='pk'){packed[i]=!packed[i];render()}else if(a=='cell')cellDlg(...i.split('|'));
else if(a=='ngr')grDlg();else if(a=='egr')grDlg(S.grades.find(x=>x.id==i));else if(a=='nev')evDlg(null,i);else if(a=='eev')evDlg(S.events.find(x=>x.id==i));
else if(a=='cm'){cal.m+=+i;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}render()}else if(a=='day'){selD=i;render()}
else if(a=='dx'){const x=S.homeworks.find(q=>q.id==i);cfm('Hausaufgabe löschen?',`${x.fach}: ${x.titel}`,()=>{S.homeworks=S.homeworks.filter(q=>q.id!=i);commit()})}
else if(a=='dp'){const n=S.homeworks.filter(q=>q.done).length;if(n)cfm('Erledigte löschen?',`${n} erledigte Hausaufgabe(n) werden gelöscht. Offene bleiben erhalten.`,()=>{S.homeworks=S.homeworks.filter(q=>!q.done);commit()})}
else if(a=='pn')enablePush();else if(a=='pf')disablePush();
else if(a=='li')login();else if(a=='lo')sb.auth.signOut();else if(a=='fa'){S.ferien.push({titel:'',von:'',bis:''});commit()}else if(a=='fx'){S.ferien.splice(+i,1);commit()}else if(a=='pdf')pdf()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const[k,a,b]=c.split('|'),v=e.target.value;
if(k=='tm')S.times[a]={...S.times[a],[b]:v};else if(k=='si')S.subjectInfos[a]={...S.subjectInfos[a],[b]:v};else if(k=='fe')S.ferien[a][b]=v;commit(false)});
// ---- PDF (manuell)
function pdf(){if(!window.jspdf)return alert('PDF-Bibliothek nicht geladen (offline?)');const{jsPDF}=window.jspdf,D=new jsPDF(),ms=mon(iso(new Date())),fr=add(ms,4),su=add(ms,6),m=pd(ms),t=new Date(Date.UTC(m.getFullYear(),m.getMonth(),m.getDate()+3)),yr=t.getUTCFullYear(),kw=Math.ceil(((t-Date.UTC(yr,0,1))/864e5+1)/7);let y=20;
const L=(x,b,z)=>{D.setFont('helvetica',b?'bold':'normal');D.setFontSize(z||10);D.splitTextToSize(String(x).replace(/[^\u0000-\u00FF]/g,''),180).forEach(l=>{if(y>280){D.addPage();y=20}D.text(l,14,y);y+=6})};
const ins=(s,a,b)=>s>=a&&s<=b;
L(`Schulplaner - Wochenübersicht KW${kw} (${DD(ms)}-${DD(fr)}${yr})`,1,15);y+=4;
L('Erledigte Aufgaben',1,12);S.homeworks.filter(h=>h.done&&h.doneAt&&ins(h.doneAt,ms,su)).forEach(h=>L(`- ${h.fach}: ${h.titel}`));y+=3;
L('Offene Aufgaben',1,12);S.homeworks.filter(h=>!h.done).sort((a,b)=>a.due.localeCompare(b.due)).forEach(h=>L(`- ${h.fach}: ${h.titel} (fällig ${fd(h.due)})`));y+=3;
L('Noten diese Woche',1,12);S.grades.filter(x=>ins(x.datum,ms,su)).forEach(x=>L(`- ${x.fach}: ${x.wert} (${x.art}, ${x.gew}x)`));y+=3;
L('Termine nächste Woche',1,12);S.events.filter(x=>ins(x.date,add(ms,7),add(ms,13))).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>L(`- ${fd(x.date)} ${x.titel} (${cap(x.typ)})`));
D.save(`Wochenübersicht_${yr}-W${p2(kw)}.pdf`)}
// ---- Push
const u8=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function enablePush(){try{if(!user)return alert('Bitte zuerst einloggen (unten bei Konto / Sync).');if(!('Notification'in window)||!('PushManager'in window)||!('serviceWorker'in navigator))return alert('Benachrichtigungen werden hier nicht unterstützt. Bitte die installierte App auf dem Handy nutzen.');
if(await Notification.requestPermission()!='granted')return alert('Benachrichtigungen wurden nicht erlaubt.');
const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
const{error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,user_id:user.id,sub:sub.toJSON()});alert(error?'Fehler: '+error.message:'Benachrichtigungen sind auf diesem Gerät aktiv ✓')}catch(e){alert('Fehler: '+e.message)}}
async function disablePush(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){if(sb&&user)await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}alert('Benachrichtigungen auf diesem Gerät ausgeschaltet.')}catch(e){alert('Fehler: '+e.message)}}
// ---- Supabase
function merge(c){const t=c.timetable||{},m={homeworks:c.homeworks,grades:c.grades,events:c.events,subjectInfos:c.subjectInfos,plan:t.plan,times:t.times,settings:c.settings,ferien:c.ferien},cu=c.updatedAt||0;
if(cu>S.updatedAt){for(const k in m)if(m[k]!=null)S[k]=m[k];S.updatedAt=cu;for(const k in LK)localStorage.setItem(k,JSON.stringify(S[LK[k]]));return true}
if(cu<S.updatedAt)dirty=true;return false}
async function pull(force){const{data,error}=await sb.from('schulplaner_data').select('data').eq('user_id',user.id).maybeSingle();if(error)return;let ch=false;const first=localStorage.getItem('sp_lastUser')!==user.id;
if(data?.data?.updatedAt){if(first){try{localStorage.setItem('sp_backup_local',JSON.stringify({at:Date.now(),d:cloud()}))}catch(e){}S.updatedAt=0}ch=merge(data.data)}else dirty=true;
localStorage.setItem('sp_lastUser',user.id);if(ch||force)render();push()}
async function sync(){if(!sb||!user)return;await push();await pull()}
async function push(){if(!sb||!user||!dirty)return;dirty=false;const{error}=await sb.from('schulplaner_data').upsert({user_id:user.id,data:cloud(),updated_at:new Date().toISOString()});if(error)dirty=true}
async function login(){if(!sb)return alert('Sync nicht verfügbar (offline?)');const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)alert('Login fehlgeschlagen: '+error.message)}
function initSb(){if(!window.supabase)return;sb=supabase.createClient(SB_URL,SB_KEY);sb.auth.onAuthStateChange((ev,s)=>{user=s?.user||null;setTimeout(()=>{if(user&&ev!='TOKEN_REFRESHED')pull(true);else render()},0)});setInterval(push,10000);document.addEventListener('visibilitychange',()=>{if(document.hidden)push();else sync()});setInterval(()=>{if(!document.hidden)sync()},30000);addEventListener('beforeunload',push)}
render();initSb();setInterval(()=>{if(tab=='hw'&&!document.querySelector('.fixed'))render()},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
